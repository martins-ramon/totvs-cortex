<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
    <div id="auth-container" class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Cortex</h1>
            <p class="auth-subtitle">Insights para liderar com confiança.</p>

            <div id="login-form" class="auth-form">
                <h2>Login</h2>
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Senha" required>
                <button onclick="login()" class="btn-primary">Entrar</button>
                <p class="auth-switch">Não tem conta? <a href="#" onclick="showRegister()">Registre-se</a></p>
            </div>

            <div id="register-form" class="auth-form" style="display: none;">
                <h2>Registrar</h2>
                <input type="text" id="register-name" placeholder="Nome completo" required>
                <input type="email" id="register-email" placeholder="Email" required>
                <input type="text" id="register-company" placeholder="Empresa" required>
                <input type="tel" id="register-phone" placeholder="Telefone (opcional)">
                <input type="password" id="register-password" placeholder="Senha" required>
                <button onclick="register()" class="btn-primary">Criar conta</button>
                <p class="auth-switch">Já tem conta? <a href="#" onclick="showLogin()">Faça login</a></p>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
