<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
    <div id="auth-container" class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Cortex</h1>
            <p class="auth-subtitle">Inteligência ao seu lado. Menos rotina, mais impacto.</p>

            <button onclick="loginWithGoogle()" class="btn-google">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="google-icon">
                Entrar com conta TOTVS (Google)
            </button>

            <p class="auth-switch" style="font-size:0.8rem;">Acesso exclusivo para e-mails autorizados.</p>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
