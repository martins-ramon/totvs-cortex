<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedbackAI - Gestor Aumentado</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="auth-container" class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">FeedbackAI</h1>
            <p class="auth-subtitle">Sistema de Feedback Assistido por IA</p>
            
            <div id="login-form" class="auth-form">
                <h2>Login</h2>
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Senha" required>
                <button onclick="login()" class="btn-primary">Entrar</button>
                <p class="auth-switch">Não tem conta? <a href="#" onclick="showRegister()">Registre-se</a></p>
            </div>
            
            <div id="register-form" class="auth-form" style="display: none;">
                <h2>Registrar</h2>
                <input type="text" id="register-name" placeholder="Nome completo" required>
                <input type="text" id="register-company" placeholder="Nome da empresa" required>
                <input type="email" id="register-email" placeholder="Email" required>
                <input type="password" id="register-password" placeholder="Senha" required>
                <button onclick="register()" class="btn-primary">Criar conta</button>
                <p class="auth-switch">Já tem conta? <a href="#" onclick="showLogin()">Faça login</a></p>
            </div>
        </div>
    </div>

    <div id="app-container" class="app-container" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>FeedbackAI</h1>
                <p id="user-company"></p>
            </div>
            <nav class="sidebar-nav">
                <a href="#" onclick="showDashboard()" class="nav-item active">
                    <span>📊</span> Dashboard
                </a>
                <a href="#" onclick="showEmployees()" class="nav-item">
                    <span>👥</span> Funcionários
                </a>
                <a href="#" onclick="showFeedbacks()" class="nav-item">
                    <span>💬</span> Feedbacks
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <p id="user-name"></p>
                    <button onclick="logout()" class="btn-logout">Sair</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div id="dashboard-view" class="view">
                <div class="view-header">
                    <h2>Dashboard de Insights</h2>
                    <p>Visão inteligente da sua equipe</p>
                </div>
                <div id="dashboard-content" class="dashboard-grid"></div>
            </div>

            <div id="employees-view" class="view" style="display: none;">
                <div class="view-header">
                    <h2>Gerenciar Funcionários</h2>
                    <button onclick="showAddEmployee()" class="btn-primary">+ Adicionar Funcionário</button>
                </div>
                <div id="employees-content"></div>
            </div>

            <div id="feedbacks-view" class="view" style="display: none;">
                <div class="view-header">
                    <h2>Cadastrar Feedback</h2>
                </div>
                <div id="feedbacks-content">
                    <div class="feedback-form-container">
                        <div class="form-group">
                            <label>Selecionar Funcionário</label>
                            <select id="feedback-employee" class="form-control">
                                <option value="">Selecione...</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Feedback ao Funcionário</label>
                            <textarea id="feedback-to-employee" class="form-control" rows="4" placeholder="Compartilhe feedback construtivo para o funcionário..."></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Feedback ao Gestor (você)</label>
                            <textarea id="feedback-to-manager" class="form-control" rows="4" placeholder="O que o funcionário gostaria de dizer ao gestor..."></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Expectativas sobre a Empresa</label>
                            <textarea id="expectations-company" class="form-control" rows="3" placeholder="Expectativas do funcionário em relação à empresa..."></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Expectativas sobre o Gestor</label>
                            <textarea id="expectations-manager" class="form-control" rows="3" placeholder="Expectativas do funcionário em relação ao gestor..."></textarea>
                        </div>
                        
                        <button onclick="submitFeedback()" class="btn-primary btn-large">Salvar Feedback com IA</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
