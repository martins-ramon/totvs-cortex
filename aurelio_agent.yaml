
version: "1.0"
agent:
  id: aurelio
  name: "Aurélio"
  role: "Mentor de gestão de equipes"
  mission: >
    Transformar feedbacks e reuniões em inteligência acionável para gestores e membros,
    elevando a performance do time com sugestões objetivas, humanas e de baixo atrito.
  persona:
    voice: "empática, objetiva, pragmática"
    principles:
      - "Sempre gerar próximos passos claros (who/what/when)"
      - "Priorizar ações de baixo atrito e alto impacto"
      - "Evitar jargões e ser específico"
      - "Respeitar HITL por padrão (human-in-the-loop)"
  defaults:
    mode: hitl
    risk_sensitivity: medium
    digest_hour: "08:30"

env:
  required:
    - CORTEX_BASE_URL
    - CORTEX_API_KEY
    - LLM_GATEWAY_URL
    - LLM_API_KEY

security:
  auth_header:
    name: "Authorization"
    format: "Bearer ${CORTEX_API_KEY}"
  webhooks:
    header: "X-AGENT-KEY"

endpoints:
  cortex:
    list_suggestions: "GET ${CORTEX_BASE_URL}/api/agents/suggestions?agent=aurelio&status=${STATUS}"
    seed_suggestion:  "POST ${CORTEX_BASE_URL}/api/agents/seed-suggestion"
    patch_suggestion: "PATCH ${CORTEX_BASE_URL}/api/agents/suggestions/${SUGGESTION_ID}"
    execute_action:   "POST ${CORTEX_BASE_URL}/api/agents/actions"
    notify:           "POST ${CORTEX_BASE_URL}/api/notifications"
    dashboard:        "GET ${CORTEX_BASE_URL}/api/dashboard"
    feedbacks_30d:    "GET ${CORTEX_BASE_URL}/api/feedbacks?since_days=30"
    meetings_30d:     "GET ${CORTEX_BASE_URL}/api/meetings?since_days=30"
  webhooks_n8n:
    feedback: "POST /agent/aurelio/feedback-webhook"
    meeting_summarized: "POST /agent/aurelio/meeting-summarized"
    hitl_action: "POST /agents/hitl-action"

schemas:
  suggestion_card:
    type: object
    required: [title, summary, details]
    properties:
      title: {type: string}
      summary: {type: string}
      details:
        type: object
        properties:
          suggestions:
            type: array
            items:
              type: object
              properties:
                title: {type: string}
                summary: {type: string}
                actions:
                  type: array
                  items:
                    type: object
                    properties:
                      label: {type: string}
                      actionId: {type: string}
                      payload: {type: object}
  notification:
    type: object
    properties:
      title: {type: string}
      message: {type: string}
      category: {type: string, enum: ["agent"]}
      cta:
        type: array
        items:
          type: object
          properties:
            label: {type: string}
            action: {type: string}
            payload: {type: object}
      is_read: {type: boolean}

prompts:
  digest:
    system: |
      Você é o **Aurélio**, mentor de gestão. Com base no dashboard (feedbacks, reuniões, tarefas),
      gere até 5 itens em JSON: {suggestions:[{title, summary, actions:[{label, actionId, payload}]}]}.
      Foque em riscos, reconhecimentos, 1:1s prioritários, follow-ups e alertas de carga/saúde.
      Sem jargões. Tom empático, objetivo e acionável.
    user_inputs:
      - date: "YYYY-MM-DD"
      - dashboard: "Objeto com métricas do time"
  feedback_hygiene:
    system: |
      Você é o Aurélio. Avalie a qualidade de um feedback (clareza, equilíbrio, próximos passos).
      Retorne JSON: {score:0-100, issues:[...], rewrite:"...", actions:[{label, actionId, payload}]}.
      Se score < 75, proponha reescrita concreta e ações observáveis.
  meeting_followups:
    system: |
      A partir de um resumo de reunião, extraia tarefas com who/what/when e riscos.
      Formato JSON: {tasks:[{assignee_id, title, due_date, notes}], risks:[...]}.
      Seja específico e realista com prazos.
  attrition_risk:
    system: |
      Consolide sinais de feedbacks e reuniões (últimos 30 dias).
      Classifique por colaborador: level: baixo|médio|alto; inclua rationale e até 3 ações de baixo atrito.
      JSON: {risks:[{user_id, level, rationale, actions:[{label, actionId, payload}]}]}.

workflows:
  digest_diario:
    trigger: "cron 08:30 todos os dias"
    steps:
      - http:
          name: get_dashboard
          method: GET
          url: "${endpoints.cortex.dashboard}"
          headers: {"Authorization": "Bearer ${CORTEX_API_KEY}"}
      - llm:
          name: llm_digest
          provider: "${LLM_GATEWAY_URL}"
          model: "gpt-4o-mini"
          temperature: 0.2
          messages:
            - role: system
              content: "${prompts.digest.system}"
            - role: user
              content:
                date: "${TODAY}"
                dashboard: "${steps.get_dashboard.response.json}"
      - transform:
          name: parse_llm_to_card
          script: |
            const parsed = JSON.parse($steps.llm_digest.response.choices[0].message.content || "{}");
            return {
              title: "Digest diário do Aurélio",
              summary: "Novas sugestões do agente para revisão",
              details: parsed
            };
      - http:
          name: seed_suggestion
          method: POST
          url: "${endpoints.cortex.seed_suggestion}"
          headers: {"Authorization": "Bearer ${CORTEX_API_KEY}", "Content-Type":"application/json"}
          body:
            user_id: "manager-demo"
            title: "${steps.parse_llm_to_card.output.title}"
            summary: "${steps.parse_llm_to_card.output.summary}"
            details: "${steps.parse_llm_to_card.output.details}"
      - http:
          name: notify_manager
          method: POST
          url: "${endpoints.cortex.notify}"
          headers: {"Authorization": "Bearer ${CORTEX_API_KEY}", "Content-Type":"application/json"}
          body:
            title: "Digest diário do Aurélio"
            message: "Novas sugestões de gestão estão prontas para revisão."
            category: "agent"
            cta: [{label:"Ver sugestões", action:"open_agent_inbox", payload:{agent:"aurelio"}}]
            is_read: false

  higiene_feedback:
    trigger: "webhook ${endpoints.webhooks_n8n.feedback}"
    steps:
      - llm:
          name: llm_hygiene
          provider: "${LLM_GATEWAY_URL}"
          model: "gpt-4o-mini"
          temperature: 0.2
          messages:
            - role: system
              content: "${prompts.feedback_hygiene.system}"
            - role: user
              content: "${request.body.feedback}"
      - transform:
          name: parse
          script: |
            let out;
            try { out = JSON.parse($steps.llm_hygiene.response.choices[0].message.content); }
            catch { out = { score: 50, issues: [], actions: [], rewrite: $steps.llm_hygiene.response.choices[0].message.content }; }
            return out;
      - http:
          name: seed_suggestion
          method: POST
          url: "${endpoints.cortex.seed_suggestion}"
          headers: {"Authorization": "Bearer ${CORTEX_API_KEY}", "Content-Type":"application/json"}
          body:
            user_id: "manager-demo"
            title: "Sugestão do Aurélio para seu feedback"
            summary: "Reescrita e próximas ações sugeridas."
            details: "${steps.parse.output}"
      - http:
          name: notify
          method: POST
          url: "${endpoints.cortex.notify}"
          headers: {"Authorization": "Bearer ${CORTEX_API_KEY}", "Content-Type":"application/json"}
          body:
            title: "Sugestão do Aurélio para seu feedback"
            message: "Reescrita e ações prontas para revisão."
            category: "agent"
            cta:
              - {label:"Aplicar reescrita", action:"open_agent_inbox", payload:{agent:"aurelio"}}
              - {label:"Ver ações", action:"open_agent_inbox", payload:{agent:"aurelio"}}
            is_read: false

  followups_reuniao:
    trigger: "webhook ${endpoints.webhooks_n8n.meeting_summarized}"
    steps:
      - llm:
          name: llm_followups
          provider: "${LLM_GATEWAY_URL}"
          model: "gpt-4o-mini"
          temperature: 0.2
          messages:
            - role: system
              content: "${prompts.meeting_followups.system}"
            - role: user
              content: "${request.body.meeting}"
      - transform:
          name: parse
          script: |
            let parsed;
            try { parsed = JSON.parse($steps.llm_followups.response.choices[0].message.content); }
            catch { parsed = { tasks: [], raw: $steps.llm_followups.response.choices[0].message.content }; }
            return parsed;
      - http:
          name: seed_suggestion
          method: POST
          url: "${endpoints.cortex.seed_suggestion}"
          headers: {"Authorization": "Bearer ${CORTEX_API_KEY}", "Content-Type":"application/json"}
          body:
            user_id: "manager-demo"
            title: "Follow-ups do Aurélio para a reunião"
            summary: "Tarefas sugeridas prontas para aprovação."
            details: "${steps.parse.output}"
      - http:
          name: notify
          method: POST
          url: "${endpoints.cortex.notify}"
          headers: {"Authorization": "Bearer ${CORTEX_API_KEY}", "Content-Type":"application/json"}
          body:
            title: "Follow-ups do Aurélio"
            message: "Tarefas sugeridas prontas para aprovação."
            category: "agent"
            cta: [{label:"Criar lembretes", action:"open_agent_inbox", payload:{agent:"aurelio"}}]
            is_read: false

  risco_saida:
    trigger: "cron 09:00 seg/qui"
    steps:
      - http:
          name: get_feedbacks
          method: GET
          url: "${endpoints.cortex.feedbacks_30d}"
          headers: {"Authorization": "Bearer ${CORTEX_API_KEY}"}
      - http:
          name: get_meetings
          method: GET
          url: "${endpoints.cortex.meetings_30d}"
          headers: {"Authorization": "Bearer ${CORTEX_API_KEY}"}
      - llm:
          name: llm_attrition
          provider: "${LLM_GATEWAY_URL}"
          model: "gpt-4o-mini"
          temperature: 0.2
          messages:
            - role: system
              content: "${prompts.attrition_risk.system}"
            - role: user
              content:
                feedbacks: "${steps.get_feedbacks.response.json}"
                meetings:  "${steps.get_meetings.response.json}"
      - transform:
          name: parse
          script: |
            let risks;
            try { risks = JSON.parse($steps.llm_attrition.response.choices[0].message.content); }
            catch { risks = { risks: [] }; }
            return risks;
      - http:
          name: seed_suggestion
          method: POST
          url: "${endpoints.cortex.seed_suggestion}"
          headers: {"Authorization": "Bearer ${CORTEX_API_KEY}", "Content-Type":"application/json"}
          body:
            user_id: "manager-demo"
            title: "Alerta de risco de saída"
            summary: "O Aurélio identificou colaboradores em risco. Revise o plano de ação."
            details: "${steps.parse.output}"
      - http:
          name: notify
          method: POST
          url: "${endpoints.cortex.notify}"
          headers: {"Authorization": "Bearer ${CORTEX_API_KEY}", "Content-Type":"application/json"}
          body:
            title: "Alerta de risco de saída"
            message: "O Aurélio identificou colaboradores em risco. Revise as ações sugeridas."
            category: "agent"
            cta: [{label:"Ver plano de ação", action:"open_agent_inbox", payload:{agent:"aurelio", view:"attrition"}}]
            is_read: false

actions:
  apply_feedback_rewrite:
    description: "Aplicar reescrita sugerida ao feedback"
    payload_schema: {type: object, properties: {feedback_id:{type:string}, rewrite:{type:string}}}
  create_followups:
    description: "Criar lembretes/tarefas a partir das sugestões"
    payload_schema: {type: object, properties: {tasks:{type: array}}}
  schedule_11:
    description: "Agendar 1:1 com membro do time"
    payload_schema: {type: object, properties: {target_user_id:{type:string}, date:{type:string}}}

modes:
  hitl:
    description: "Todas as ações precisam de aprovação do gestor"
    enforcement:
      - "Sugestões entram como pending"
      - "Aprovação dispara /api/agents/actions e PATCH /suggestions/:id"
  autonomous:
    description: "Agente pode executar ações diretamente"
    safeguards:
      - "Rate limit por gestor"
      - "Auditoria em agent_actions"
      - "Limites por tipo de ação"
